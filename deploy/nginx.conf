server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Missing bundles must be 404s, never HTML masquerading as JavaScript.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Revalidate HTML so a deployment does not retain old bundle references.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
